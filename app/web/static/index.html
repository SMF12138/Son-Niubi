<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CNY/RUB · 人民币兑卢布预测</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <nav class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-seal">印</span>
        <div class="brand-text">
          <span class="brand-name">人民币兑卢布预测</span>
          <span class="brand-sub">CNY / RUB Exchange Rate Forecast</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="topbar-status" id="topbarStatus"></span>
        <button class="theme-toggle" id="themeToggle" title="切换明暗">
          <span class="theme-icon-light">☀</span>
          <span class="theme-icon-dark">☽</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <!-- 核心预测卡 -->
    <section class="hero-card" id="hero">
      <div class="hero-loading">
        <div class="loader"></div>
        <span>加载预测数据…</span>
      </div>
    </section>

    <!-- 时长切换 -->
    <div class="horizon-bar" id="horizonBar">
      <button data-hor="7" class="hz-btn active">七日</button>
      <button data-hor="30" class="hz-btn">三十日</button>
      <button data-hor="60" class="hz-btn">六十日</button>
      <button data-hor="90" class="hz-btn">九十日</button>
    </div>

    <!-- 主预测图 -->
    <section class="card chart-card">
      <div class="card-header">
        <h2>汇率走势与预测</h2>
        <label class="toggle">
          <input type="checkbox" id="histToggle" checked />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-label">历史</span>
        </label>
      </div>
      <div id="mainChart" class="chart"></div>
      <p class="chart-hint">
        蓝线 = 历史真实汇率 · 虚线 = 未来预测 · 阴影带 = 不确定性区间
      </p>
    </section>

    <!-- 系统健康度 -->
    <section class="card health-card">
      <h2>模型健康度</h2>
      <div id="healthContent" class="health-body">加载中…</div>
    </section>

    <!-- 不确定性说明 -->
    <section class="card uncert-card" id="uncertSection" style="display:none">
      <details>
        <summary>
          <span class="uncert-badge" id="uncertBadge"></span>
          <span class="uncert-title" id="uncertTitle"></span>
          <span class="uncert-chevron">›</span>
        </summary>
        <div class="uncert-body" id="uncertBody"></div>
      </details>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-ornament">— ◆ —</div>
    <p>本页为数据分析展示，不构成任何投资建议。预测基于历史规律，无法保证未来表现。</p>
  </footer>

  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
